name: Restore completed final refit (one-off)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-final-refit-once.yml'

permissions:
  contents: write
  actions: read

jobs:
  recover-final-refit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Retrieve completed execution artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/executed-final
          gh run download 43048370108 -n executed-group-notebook --dir /tmp/executed-final
          test -s /tmp/executed-final/online_shoppers_analysis.ipynb
      - name: Verify execution and restore Section 11.2 output only
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          original_path = Path('online_shoppers_analysis.ipynb')
          executed_path = Path('/tmp/executed-final/online_shoppers_analysis.ipynb')
          original = json.loads(original_path.read_text(encoding='utf-8'))
          executed = json.loads(executed_path.read_text(encoding='utf-8'))
          assert len(original['cells']) == len(executed['cells'])
          for old, new in zip(original['cells'], executed['cells']):
              assert old.get('id') == new.get('id')
              assert old['cell_type'] == new['cell_type']
              assert ''.join(old['source']) == ''.join(new['source']), f"Source changed: {old.get('id')}"
              if new['cell_type'] == 'code':
                  assert isinstance(new.get('execution_count'), int), f"Cell not executed: {old.get('id')}"
                  assert not any(o.get('output_type') == 'error' for o in new['outputs']), f"Execution error: {old.get('id')}"
          target_id = '9c3a7103'
          matches = [i for i,c in enumerate(original['cells']) if c.get('id') == target_id]
          assert len(matches) == 1
          i = matches[0]
          old, new = original['cells'][i], executed['cells'][i]
          assert 'FINAL_PIPELINE=clone(TRAIN_SELECTED_SPEC)' in ''.join(new['source'])
          assert new['outputs'], 'Final refit produced no visible output'
          output_text = '\n'.join(
              ''.join(o.get('data',{}).get('text/plain',[])) if isinstance(o.get('data',{}).get('text/plain',[]),list)
              else o.get('data',{}).get('text/plain','')
              for o in new['outputs']
          )
          for expected in ['L6 Logistic Regression','CV-selected C (frozen)','Preprocessing','12330','Completed']:
              assert expected in output_text, f'Missing final specification field: {expected}'
          original['cells'][i]['outputs'] = new['outputs']
          original['cells'][i]['execution_count'] = new['execution_count']
          original_path.write_text(json.dumps(original,ensure_ascii=False,indent=1)+'\n',encoding='utf-8')
          updated = json.loads(original_path.read_text(encoding='utf-8'))
          for index,(a,b) in enumerate(zip(updated['cells'],executed['cells'])):
              if index != i:
                  assert a['source'] == b['source']
          print('PASS: all 35 notebook code cells executed successfully in prior run.')
          print('PASS: restored only final refit output; earlier graphs/outputs unchanged.')
          print(output_text[:4000])
          PY
      - name: Commit restored output to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add online_shoppers_analysis.ipynb
          git diff --cached --stat
          if ! git diff --cached --quiet; then
            git commit -m 'results: restore validated Section 11.2 output [skip ci]'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
