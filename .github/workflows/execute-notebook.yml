name: Execute group analysis notebook

on:
  push:
    branches:
      - main
      - 'analysis/**'
    paths:
      - online_shoppers_analysis.ipynb
      - data/online_shoppers.csv
      - requirements.txt
      - .github/workflows/execute-notebook.yml
  pull_request:
    paths:
      - online_shoppers_analysis.ipynb
      - data/online_shoppers.csv
      - requirements.txt
      - .github/workflows/execute-notebook.yml
  workflow_dispatch:

concurrency:
  group: group-notebook-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  notebook:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install notebook dependencies
        run: python -m pip install -r requirements.txt
      - name: Execute all notebook cells
        run: |
          jupyter nbconvert --to notebook --execute online_shoppers_analysis.ipynb \
            --ExecutePreprocessor.timeout=7200 \
            --output online_shoppers_analysis_executed.ipynb
          mv online_shoppers_analysis_executed.ipynb online_shoppers_analysis.ipynb
      - name: Verify executed notebook and analysis values
        run: |
          git fetch --depth=1 origin main:refs/remotes/origin/main
          python - <<'PY'
          import nbformat, pathlib, re
          import pandas as pd
          nb = nbformat.read('online_shoppers_analysis.ipynb', as_version=4)
          nbformat.validate(nb)
          code = [cell for cell in nb.cells if cell.cell_type == 'code']
          assert len(code) == 36
          assert all(isinstance(cell.execution_count, int) for cell in code)
          assert not any(output.output_type == 'error' for cell in code for output in cell.outputs)
          source = '\n'.join(cell.source for cell in nb.cells)
          assert not re.search(r'\bPRD\b|\bv3[._-]\d+\b|artifacts/prd|archive/versions/', source, re.I)
          assert 'data/online_shoppers.csv' in source
          assert 'T_STAR=C_FP/(C_FP+C_FN)' in source
          assert 'ALL_FINALISTS_AT_T' in source
          assert '### 2.3 Overall numerical predictor correlations' in source
          assert 'CORR_FULL = Xtr[NUMERIC_ALL].corr(method="pearson")' in source
          assert "span=2" in source
          assert '### 3.2 Positive activity intensity' in source
          assert '### 3.4 Within-class predictor correlations' in source
          assert '### 3.6 SpecialDay and purchase behaviour' in source
          assert '### EDA-to-experiment bridge' not in source
          assert '## 3. Categorical EDA' not in source
          assert '## 4. Predictor relationships and assumptions' not in source
          assert len(pd.read_csv('data/online_shoppers.csv')) == 12330

          summary = '\n'.join(output.text for output in code[-1].outputs
                              if output.output_type == 'stream')
          assert 'Winner (PR-AUC): L6 | Logit' in summary, summary
          assert 'Sequential candidate checks: 43 planned, 38 scored, 5 inapplicable.' in summary, summary
          ap = re.search(r'mean five-fold AP=(\d+\.\d+)', summary)
          auc = re.search(r'mean five-fold ROC-AUC=(\d+\.\d+)', summary)
          reserved = re.search(r'Reserved-set check: AP=(\d+\.\d+); ROC-AUC=(\d+\.\d+)', summary)
          assert auc and ap and reserved, summary
          assert abs(float(ap.group(1)) - 0.34207) < 0.0001
          assert abs(float(auc.group(1)) - 0.75095) < 0.0001
          assert abs(float(reserved.group(1)) - 0.32534) < 0.0001
          assert abs(float(reserved.group(2)) - 0.73804) < 0.0001

          finalist_cell = [cell for cell in code if 'ALL_FINALISTS_AT_T=pd.DataFrame' in cell.source]
          assert len(finalist_cell) == 1
          finalist_text = ''.join(o.get('text', '') for o in finalist_cell[0].outputs if o.output_type == 'stream')
          assert 'cheapest finalist is' in finalist_text, finalist_text

          # Integrity guardrail: normalise approved explanation text and display aliases only.
          import json, subprocess
          old = json.loads(subprocess.check_output(
              ['git','show','origin/main:online_shoppers_analysis.ipynb'],text=True))
          old_cells = old['cells']
          anchor = 'd3121f8a'
          start = next(i for i,c in enumerate(old_cells) if c.get('id')==anchor)
          expected = {c['id']: ''.join(c['source']) for c in old_cells[start:] if c['cell_type']=='code'}
          actual = {c['id']: ''.join(c['source']) for c in nb.cells if c.cell_type=='code'}

          def without_presentation_copy(value):
              begin, end = '\nEDA_NOTES={', '\nDISPLAY_ALIAS_ROWS=[]'
              if begin not in value:
                  return value
              assert value.count(begin)==1 and value.count(end)==1
              a=value.index(begin); b=value.index(end,a)
              value=value[:a]+'\nEDA_NOTES=<PRESENTATION_ONLY>'+value[b:]
              value=value.replace(
                  'labels={original:prefix+str(i+1) for i,original in enumerate(origins)}',
                  'labels={original:prefix+str(i) for i,original in enumerate(origins)}')
              value=re.sub(r'(?m)^\s*state=.*if initial else .*$','        state=<PRESENTATION_ONLY>',value)
              value=re.sub(r'(?m)^\s*notes\.append\(.*EDA_NOTES\.get.*$',
                           '        notes.append(<PRESENTATION_ONLY>)',value)
              value=re.sub(r"(?m)^\s*display\(Markdown\('\*\*Iteration notes.*$",
                           '    display(<PRESENTATION_ONLY>)',value)
              return value

          assert all(without_presentation_copy(actual.get(cid,''))==without_presentation_copy(src)
                     for cid,src in expected.items()), 'Model calculations differ from main beyond presentation-only changes'

          # Verify 28 consecutive visible model labels and their explanation blocks.
          assert 'labels={original:prefix+str(i+1) for i,original in enumerate(origins)}' in source
          for fam,mark in [('Logit','L'),('LDA','D'),('GaussianNB','G'),('BernoulliNB','B')]:
              display_cell=next(c for c in code if f"display_family('{fam}')" in c.source)
              note=''.join(o.data.get('text/markdown','') for o in display_cell.outputs
                           if o.output_type in ('display_data','execute_result'))
              assert all(f'- **{mark}{j} —' in note for j in range(1,8)),fam
              assert f'- **{mark}0 —' not in note,fam

          for family, marker in [('Logit','L'),('LDA','D'),('GaussianNB','G'),('BernoulliNB','B')]:
              found = [cell for cell in code if f"display_family('{family}')" in cell.source]
              assert len(found) == 1, (family, len(found))
              texts = '\n'.join((''.join(o.data.get('text/plain',''))
                                  if o.output_type in ('display_data','execute_result') else '')
                                 for o in found[0].outputs)
              assert all(re.search(r'\b'+marker+str(i)+r'\b',texts) for i in range(1,8)), family

          print(f'PASS: {len(code)} executed code cells; 28 displayed classifier specifications; '
                '43 planned trials / 38 scored; L6 displayed as AP winner; CV and reserved scores match; '
                't* applied to every finalist.')
          PY
      - name: Save executed notebook to review branch
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/analysis/')
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add online_shoppers_analysis.ipynb
          if ! git diff --cached --quiet; then
            git commit -m 'results: save executed group notebook [skip ci]'
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
      - name: Attach executed notebook
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: executed-group-notebook
          path: online_shoppers_analysis.ipynb
          retention-days: 14
