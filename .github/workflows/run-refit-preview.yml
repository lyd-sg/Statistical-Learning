name: Execute final refit preview
on:
  push:
    branches:
      - report/final-refit-specification
    paths:
      - .github/workflows/run-refit-preview.yml

concurrency:
  group: refit-preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install notebook dependencies
        run: python -m pip install -r requirements.txt
      - name: Execute notebook
        run: |
          jupyter nbconvert --to notebook --execute online_shoppers_analysis.ipynb \
            --ExecutePreprocessor.timeout=7200 --output online_shoppers_analysis_executed.ipynb
          mv online_shoppers_analysis_executed.ipynb online_shoppers_analysis.ipynb
      - name: Check final refit tables
        run: |
          python - <<'PY'
          import nbformat
          nb=nbformat.read('online_shoppers_analysis.ipynb',as_version=4)
          nbformat.validate(nb)
          def output(cell_id):
              cell=next(c for c in nb.cells if c.get('id')==cell_id)
              assert isinstance(cell.execution_count,int),cell_id
              assert not any(x.output_type=='error' for x in cell.outputs)
              return '\n'.join(
                  ''.join(x.data.get('text/plain','')) 
                  for x in cell.outputs if x.output_type in ('display_data','execute_result'))
          spec=output('9c3a7103')
          coeff=output('f11coeffpy')
          assert all(x in spec for x in ('L6 LASSO Logistic Regression','Encoded features',
              'Retained features','0.01','12330')),spec
          assert 'Intercept' in coeff and 'Retained feature' in coeff,coeff
          print('PASS: final refit summary and LASSO coefficients generated')
          print(spec)
          print(coeff)
          PY
      - name: Commit executed outputs to preview branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add online_shoppers_analysis.ipynb
          if ! git diff --cached --quiet; then
            git commit -m 'results: execute final refit tables [skip ci]'
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
      - name: Attach executed notebook
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: executed-refit-preview
          path: online_shoppers_analysis.ipynb
          retention-days: 7
